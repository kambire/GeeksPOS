services:
  app:
    build: .
    container_name: geekspos_app
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      # Monta el código para editar en caliente (los cambios se ven al instante)
      - .:/var/www/html
    environment:
      # Sin APP_BASE_URL: el base_url se autodetecta (localhost o IP de la red LAN)
      DB_HOST: db
      DB_NAME: geekscom_nicole
      DB_USER: geekscom_nicole
      DB_PASS: "${DB_PASS:?Falta DB_PASS en .env}"
      # GeeksIA: secretos de integraciones (ver .env.example)
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en .env}"
      N8N_API_KEY: "${N8N_API_KEY:-}"
      GEEKSIA_SECRET_KEY: "${GEEKSIA_SECRET_KEY:?Falta GEEKSIA_SECRET_KEY en .env}"
      GEEKSPOS_PLATFORM_ALLOW_PUBLIC: "${GEEKSPOS_PLATFORM_ALLOW_PUBLIC:-0}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: geekspos_db
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}"
      MYSQL_DATABASE: geekscom_nicole
      MYSQL_USER: geekscom_nicole
      MYSQL_PASSWORD: "${DB_PASS:?Falta DB_PASS en .env}"
    volumes:
      - db_data:/var/lib/mysql
      # El dump se importa automáticamente SOLO la primera vez (BD vacía)
      - ./Geekspos.sql:/docker-entrypoint-initdb.d/01-geekspos.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: geekspos_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Asuncion
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app

  evolution_db:
    image: postgres:15-alpine
    container_name: geekspos_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "${EVOLUTION_DB_PASS:?Falta EVOLUTION_DB_PASS en .env}"
      POSTGRES_DB: evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: geekspos_evolution_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8081}:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Falta EVOLUTION_API_KEY en .env}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASS:?Falta EVOLUTION_DB_PASS en .env}@evolution_db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/whatsapp-pos
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution_db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: geekspos_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:80
    depends_on:
      - app

volumes:
  db_data:
  n8n_data:
  evolution_db_data:
  evolution_instances:
